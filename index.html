<!DOCTYPE html><html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شذر ❤️</title><style>
body{
margin:0;
padding:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff4d94,#ff80bf);
overflow:hidden;
font-family:Tahoma,sans-serif;
direction:rtl;
}

.card{
background:white;
padding:30px;
border-radius:25px;
text-align:center;
width:320px;
box-shadow:0 0 25px rgba(0,0,0,.2);
z-index:2;
}

h1{
color:#ff2d75;
}

button{
background:#ff2d75;
color:white;
border:none;
padding:12px 25px;
border-radius:20px;
font-size:18px;
cursor:pointer;
}

.heart{
position:absolute;
font-size:25px;
animation:up 8s linear infinite;
}

@keyframes up{
0%{
transform:translateY(100vh);
opacity:0;
}
100%{
transform:translateY(-100px);
opacity:1;
}
}
</style></head><body><div class="card">
<h1>❤️ شذر ❤️</h1>
<p>أنتِ أجمل صدفة في حياتي 🌹</p><button onclick="showLove()">
اضغطي هنا ✨
</button><p id="msg"></p>
</div><script>
function showLove(){
document.getElementById("msg").innerHTML =
"أحبك يا شذر ❤️";
}

for(let i=0;i<40;i++){
let h=document.createElement("div");
h.className="heart";
h.innerHTML="💖";
h.style.left=Math.random()*100+"vw";
h.style.animationDuration=(4+Math.random()*6)+"s";
document.body.appendChild(h);
}
</script></body>
</html>
